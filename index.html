<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Renz Torres | Links</title>
<style>
  :root {
    --space: #000;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-hover: rgba(255, 255, 255, 0.12);
    --edge: rgba(255, 255, 255, 0.22);
    --text: #f4f4f4;
    --muted: #a8a8a8;
    --glow: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    background: #000;
  }
  html, body { min-height: 100%; }
  body { overflow-wrap: anywhere; }

  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: #000;
    overflow-x: hidden;
  }

  /* Star canvas sits behind everything */
  #leaves {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100lvh;
    z-index: 0;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  .card {
    width: 100%;
    max-width: 460px;
    padding: 36px 28px 28px;
    text-align: center;
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 28px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 50px rgba(255, 255, 255, 0.06), inset 0 0 30px rgba(255, 255, 255, 0.03);
  }

  .avatar {
    width: 104px;
    height: 104px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 2.4rem;
    font-weight: 700;
    background: radial-gradient(circle at 30% 30%, #3a3a3a, #0a0a0a 70%);
    border: 2px solid var(--glow);
    box-shadow: 0 0 24px rgba(255, 255, 255, 0.35);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  h1 { font-size: 1.6rem; letter-spacing: 0.02em; }

  .bio {
    margin: 8px auto 26px;
    max-width: 34ch;
    color: var(--muted);
    font-size: 0.97rem;
    line-height: 1.5;
  }

  .links { display: flex; flex-direction: column; gap: 12px; list-style: none; }

  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px 18px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 16px;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .links a:hover,
  .links a:focus-visible {
    background: var(--glass-hover);
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.22);
    outline: none;
  }
  .links a:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

  .links svg { width: 22px; height: 22px; flex: none; fill: currentColor; }
  .links span { text-align: center; }

  footer { margin-top: 24px; font-size: 0.8rem; color: var(--muted); }

  .links a { min-height: 52px; touch-action: manipulation; }

  /* Hover lift only on devices that truly hover (avoids sticky hover on phones) */
  @media (hover: none) {
    .links a:hover { transform: none; box-shadow: none; background: var(--glass); }
    .links a:active { background: var(--glass-hover); transform: scale(0.98); }
  }

  /* Small phones */
  @media (max-width: 480px) {
    .card { padding: 28px 18px 22px; border-radius: 22px; }
    .avatar { width: 92px; height: 92px; font-size: 2.1rem; }
    h1 { font-size: 1.4rem; }
    .bio { font-size: 0.93rem; margin-bottom: 22px; }
    .links { gap: 10px; }
  }

  /* Very small / short screens (landscape phones) */
  @media (max-height: 520px) {
    main { align-items: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    .links a { transition: none; }
  }
</style>
</head>
<body>

<canvas id="leaves" aria-hidden="true"></canvas>

<main>
  <section class="card">
    <div class="avatar">
      <img src="aslan.webp" alt="Renz Torres">
      
    </div>
    <h1>Renz Torres</h1>
    <p class="bio">The lion is bored and made this</p>

    <ul class="links">
      <li><a href="https://www.instagram.com/_tssrenz/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2A3.2 3.2 0 1 1 12 8.8a3.2 3.2 0 0 1 0 6.4zM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 1.8A3.7 3.7 0 0 0 3.8 7.5v9a3.7 3.7 0 0 0 3.7 3.7h9a3.7 3.7 0 0 0 3.7-3.7v-9a3.7 3.7 0 0 0-3.7-3.7z"/></svg>
        <span>Instagram</span></a></li>

        <svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v13.2a2.9 2.9 0 1 1-2-2.8V9.1a6.1 6.1 0 1 0 5.2 6V8.6a7.6 7.6 0 0 0 4.4 1.4V6.8a4.4 4.4 0 0 1-4.4-4.8z"/></svg>
        <span>TikTok</span></a></li>
      <li><a href="https://www.youtube.com/@Xenopn23" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3z"/></svg>

        <span>Facebook</span></a></li>

    <footer>&copy; He is him</footer>
  </section>
</main>

<script>
(() => {
  const canvas = document.getElementById('leaves');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, raf, leaves = [];

  function makeLeaf(randomY) {
    const size = Math.random() * 10 + 8;
    return {
      x: Math.random() * w,
      y: randomY ? Math.random() * h : -size * 2,
      size,
      fall: Math.random() * 0.8 + 0.5,
      sway: Math.random() * 1.2 + 0.4,
      phase: Math.random() * Math.PI * 2,
      freq: Math.random() * 0.015 + 0.008,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.03,
      flip: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.35 + 0.5
    };
  }

  let lastW = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); // keeps phones smooth
    const newW = window.innerWidth;
    w = newW; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Only rebuild leaves when the width changes (mobile address bar
    // showing/hiding changes height only and must not reset the animation)
    if (newW !== lastW) {
      lastW = newW;
      const count = Math.min(45, Math.max(14, Math.floor((w * h) / 28000)));
      leaves = Array.from({ length: count }, () => makeLeaf(true));
    }
  }

  function drawLeaf(l) {
    const s = l.size;
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.scale(1, Math.abs(Math.cos(l.flip)) * 0.7 + 0.3); // tumbling effect
    ctx.globalAlpha = l.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * 0.9, -s * 0.5, s * 0.7, s * 0.6, 0, s);
    ctx.bezierCurveTo(-s * 0.7, s * 0.6, -s * 0.9, -s * 0.5, 0, -s);
    ctx.fill();
    // center vein
    ctx.globalAlpha = l.alpha * 0.6;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.8);
    ctx.lineTo(0, s * 0.95);
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < leaves.length; i++) {
      const l = leaves[i];
      l.phase += l.freq;
      l.x += Math.sin(l.phase) * l.sway;
      l.y += l.fall;
      l.rot += l.spin;
      l.flip += 0.02;
      drawLeaf(l);
      if (l.y > h + l.size * 2) leaves[i] = makeLeaf(false);
    }
    raf = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  document.addEventListener('visibilitychange', () => {
    if (reduceMotion) return;
    if (document.hidden) cancelAnimationFrame(raf);
    else raf = requestAnimationFrame(draw);
  });
  resize();

  if (reduceMotion) {
    leaves.forEach(drawLeaf); // still leaves only
  } else {
    draw();
  }
})();
</script>
</body>
</html>
